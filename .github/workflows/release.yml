name: Release SDK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to release, for example v0.0.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    name: Package and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Generate Homebrew Formula
        run: |
          ./scripts/generate-homebrew-formula.sh "$RELEASE_TAG"
          # Older release tags used a generator that normalized their URL to vX.Y.Z.
          # Keep manually re-run releases with tags such as 0.0.1 compatible too.
          if [[ "$RELEASE_TAG" != v* ]]; then
            sed -i "s|/download/v${RELEASE_TAG}/|/download/${RELEASE_TAG}/|g" \
              "dist/v${RELEASE_TAG}/sdk.rb"
          fi

      - name: Create GitHub Release and upload archives
        run: |
          version="${RELEASE_TAG#v}"
          release_dir="dist/v$version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$release_dir"/* --clobber
          else
            gh release create "$RELEASE_TAG" "$release_dir"/* --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Verify Homebrew Tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN repository secret." >&2
            echo "Create a fine-grained token with Contents: Read and write access to Denxuan/homebrew-tab." >&2
            exit 1
          fi

      - name: Check out Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: Denxuan/homebrew-tab
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Formula to Homebrew Tap
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p homebrew-tap/Formula
          cp "dist/v$version/sdk.rb" homebrew-tap/Formula/sdk.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sdk.rb
          if git diff --cached --quiet; then
            echo "Homebrew Formula is already up to date."
            exit 0
          fi
          git commit -m "sdk $RELEASE_TAG"
          git push
